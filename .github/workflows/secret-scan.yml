name: Secret Protection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Block Exposed Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if credential files are tracked
        run: |
          set -euo pipefail
          BAD=$(git ls-files | grep -E '(^|/)\.env$|(^|/)credentials\.env$|(^|/)google_credentials\.json$|(^|/)slack_config\.json$|\.pem$|id_rsa' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Credential files must never be committed:"
            echo "$BAD"
            exit 1
          fi
          echo "No credential files tracked."

      - name: Scan for live secret patterns
        run: |
          set -euo pipefail
          # Scan tracked files only (exclude examples/docs placeholders)
          if git grep -nE \
            'ATATT3[A-Za-z0-9_\-=]+|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-proj-[A-Za-z0-9_\-]{20,}|sk-[A-Za-z0-9]{20,}|AQ\.[A-Za-z0-9_\-]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|hooks\.slack\.com/services/[A-Z0-9]+/[A-Z0-9]+/[A-Za-z0-9]+' \
            -- \
            ':!.github/workflows/secret-scan.yml' \
            ':!**/env.example' \
            ':!**/*.example.json' \
            ':!**/README.md' \
            ':!**/QUICKSTART.md' \
            || false
          then
            echo "::error::Possible live credentials detected in tracked files."
            exit 1
          fi
          echo "No live secret patterns found in tracked files."

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
